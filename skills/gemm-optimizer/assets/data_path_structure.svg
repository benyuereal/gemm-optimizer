<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 552" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="aw" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="aa" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="an" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="1200" height="552" fill="#ffffff"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#1f2937"/>
  <text x="600" y="33" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">DCU 内存层级与 GEMM 数据通路（权重过路 vs 激活常驻，slc evict-first 作用点）</text>

  <!-- ===== ① 内存层级 ===== -->
  <rect x="30" y="70" width="380" height="420" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="220" y="97" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">① 内存层级</text>

  <rect x="70" y="112" width="300" height="42" rx="6" fill="#1e293b"/>
  <text x="220" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">HBM　1.8 TB/s（权重 524MB · 激活 327KB）</text>
  <path d="M220,154 L220,172" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#an)"/>

  <rect x="70" y="176" width="300" height="42" rx="6" fill="#2563eb"/>
  <text x="220" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L2　8MB（全 64 CU 共享）</text>
  <path d="M220,218 L220,236" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#an)"/>

  <rect x="70" y="240" width="300" height="42" rx="6" fill="#16a34a"/>
  <text x="220" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">L1 / LDS　64KB / CU</text>
  <path d="M220,282 L220,300" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#an)"/>

  <rect x="70" y="304" width="300" height="42" rx="6" fill="#334155"/>
  <text x="220" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">VGPR 寄存器</text>
  <path d="M220,346 L220,364" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#an)"/>

  <rect x="70" y="368" width="300" height="42" rx="6" fill="#1e293b"/>
  <text x="220" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Vector ALU（MMAC）</text>

  <text x="220" y="446" text-anchor="middle" font-size="12.5" fill="#475569">权重只沿 HBM→L2→VGPR 过路；</text>
  <text x="220" y="466" text-anchor="middle" font-size="12.5" fill="#475569">激活多停一程 LDS</text>

  <!-- ===== ② GEMM 两条数据通路 ===== -->
  <rect x="430" y="70" width="740" height="420" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="800" y="97" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e293b">② GEMM 两条数据通路：权重（蓝）过路 vs 激活（绿）常驻</text>

  <rect x="600" y="112" width="400" height="42" rx="6" fill="#1e293b"/>
  <text x="800" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">HBM（权重 524MB · 激活 327KB）</text>
  <path d="M700,154 L588,176" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aw)"/>
  <path d="M900,154 L1032,176" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#aa)"/>

  <!-- 权重 column (left) -->
  <rect x="450" y="178" width="230" height="46" rx="6" fill="#2563eb"/>
  <text x="565" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">权重 W</text>
  <text x="565" y="216" text-anchor="middle" font-size="11.5" fill="#dbeafe">1600 片 · 各读 1 次（流式）</text>
  <path d="M565,224 L565,242" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aw)"/>

  <rect x="450" y="244" width="230" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">L2（evict-first 最先逐出）</text>
  <text x="565" y="282" text-anchor="middle" font-size="11" fill="#b45309">slc · bit17</text>
  <path d="M565,290 L565,308" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aw)"/>

  <rect x="450" y="310" width="230" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">VGPR（buffer_load 直入）</text>
  <text x="565" y="348" text-anchor="middle" font-size="11" fill="#64748b">不经过 LDS ✕</text>

  <!-- 激活 column (right) -->
  <rect x="920" y="178" width="230" height="46" rx="6" fill="#16a34a"/>
  <text x="1035" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">激活 A</text>
  <text x="1035" y="216" text-anchor="middle" font-size="11.5" fill="#dcfce7">复用 1600 次（高价值）</text>
  <path d="M1035,224 L1035,242" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#aa)"/>

  <rect x="920" y="244" width="230" height="46" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1035" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">L2（常驻 RESIDENT）</text>
  <text x="1035" y="282" text-anchor="middle" font-size="11" fill="#64748b">腾出位置给它</text>
  <path d="M1035,290 L1035,308" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#aa)"/>

  <rect x="920" y="310" width="230" height="46" rx="6" fill="#16a34a"/>
  <text x="1035" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">LDS（ds_write → ds_read）</text>
  <text x="1035" y="348" text-anchor="middle" font-size="11" fill="#dcfce7">经 LDS 中转</text>

  <!-- converge to MMAC -->
  <path d="M565,356 L565,392 L660,392" fill="none" stroke="#2563eb" stroke-width="2.6"/>
  <path d="M660,392 L660,412" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#aw)"/>
  <path d="M1035,356 L1035,392 L940,392" fill="none" stroke="#16a34a" stroke-width="2.6"/>
  <path d="M940,392 L940,412" fill="none" stroke="#16a34a" stroke-width="2.6" marker-end="url(#aa)"/>

  <rect x="600" y="414" width="400" height="40" rx="6" fill="#1e293b"/>
  <text x="800" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MMAC 计算　D = A × W</text>

  <!-- ===== Legend ===== -->
  <rect x="430" y="508" width="740" height="30" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="446" y="528" font-size="12.5" fill="#334155">
    <tspan fill="#2563eb" font-weight="700">■ 权重</tspan>：HBM → L2 → VGPR（不经 LDS）· 打 slc evict-first（bit17，进 L2 但最先被逐）　　<tspan fill="#16a34a" font-weight="700">■ 激活</tspan>：HBM → L2 → LDS → VGPR · 留 L2 常驻
  </text>
</svg>
