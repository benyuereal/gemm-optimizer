<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="aw" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2f6fdb"/></marker>
    <marker id="aa" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2f9e5b"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- Title banner -->
  <rect x="120" y="18" width="960" height="42" rx="21" fill="#1f2937"/>
  <text x="600" y="45" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">gfx938 GEMM 数据通路　HBM → L2 → 共享内存(LDS) → 寄存器(VGPR)</text>
  <text x="600" y="78" text-anchor="middle" font-size="13.5" fill="#5b6472">权重 = 过路旅客（流式，slc evict-first）　·　激活 = 常驻居民（高复用，留 L2）</text>

  <!-- ===== HBM card ===== -->
  <rect x="40" y="96" width="265" height="372" rx="10" fill="#f4f8fd" stroke="#b9d0ef" stroke-width="1.4"/>
  <rect x="50" y="108" width="245" height="34" rx="8" fill="#3b7bd6"/>
  <text x="172" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">HBM 主存储</text>
  <text x="55" y="164" font-size="12.5" font-weight="700" fill="#2f6fdb">权重 W（流式）</text>
  <rect x="55" y="172" width="235" height="26" fill="#2f6fdb"/><text x="172" y="190" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">W₀</text>
  <rect x="55" y="202" width="235" height="26" fill="#2f6fdb"/><text x="172" y="220" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">W₁</text>
  <rect x="55" y="232" width="235" height="26" fill="#2f6fdb"/><text x="172" y="250" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">W₂</text>
  <text x="172" y="278" text-anchor="middle" font-size="16" fill="#9aa2af">⋯</text>
  <rect x="55" y="286" width="235" height="26" fill="#2f6fdb"/><text x="172" y="304" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">W₁₅₉₉</text>
  <text x="172" y="332" text-anchor="middle" font-size="11.5" fill="#5b6472">524MB · 1600 片 · 各读 1 次</text>
  <rect x="55" y="352" width="235" height="70" rx="6" fill="#2f9e5b"/>
  <text x="172" y="382" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">激活 A</text>
  <text x="172" y="404" text-anchor="middle" fill="#eafaf0" font-size="12">327KB · 复用 1600 次</text>

  <!-- ===== L2 card ===== -->
  <rect x="325" y="96" width="265" height="372" rx="10" fill="#f1faf5" stroke="#b3dcc4" stroke-width="1.4"/>
  <rect x="335" y="108" width="245" height="34" rx="8" fill="#2f9e5b"/>
  <text x="457" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">L2 Cache</text>
  <rect x="340" y="170" width="235" height="104" rx="6" fill="#eef4fd" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 4"/>
  <text x="457" y="198" text-anchor="middle" fill="#2f6fdb" font-size="13.5" font-weight="700">W evict-first</text>
  <text x="457" y="222" text-anchor="middle" fill="#b45309" font-size="12.5" font-weight="700">最先逐出</text>
  <text x="457" y="244" text-anchor="middle" fill="#5b6472" font-size="11">进 L2 但先牺牲</text>
  <text x="457" y="262" text-anchor="middle" fill="#b45309" font-size="11" font-weight="700">slc · bit17</text>
  <rect x="340" y="352" width="235" height="70" rx="6" fill="#2f9e5b"/>
  <text x="457" y="382" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">A 常驻</text>
  <text x="457" y="404" text-anchor="middle" fill="#eafaf0" font-size="11.5">RESIDENT · 腾位保住</text>

  <!-- ===== LDS card ===== -->
  <rect x="610" y="96" width="265" height="372" rx="10" fill="#fdf6ea" stroke="#ecd3a6" stroke-width="1.4"/>
  <rect x="620" y="108" width="245" height="34" rx="8" fill="#d97e06"/>
  <text x="742" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">L1 / LDS</text>
  <rect x="625" y="182" width="235" height="70" rx="6" fill="#ffffff" stroke="#c7cdd6" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="742" y="212" text-anchor="middle" fill="#9aa2af" font-size="13" font-weight="700">权重不经过 ✕</text>
  <text x="742" y="234" text-anchor="middle" fill="#b6bdc7" font-size="11">W 绕过共享内存</text>
  <rect x="625" y="352" width="235" height="70" rx="6" fill="#2f9e5b"/>
  <text x="742" y="382" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">A tiles</text>
  <text x="742" y="404" text-anchor="middle" fill="#eafaf0" font-size="11">ds_write → ds_read</text>

  <!-- ===== VGPR card ===== -->
  <rect x="895" y="96" width="265" height="372" rx="10" fill="#f4f5f7" stroke="#cdd3dc" stroke-width="1.4"/>
  <rect x="905" y="108" width="245" height="34" rx="8" fill="#4b5563"/>
  <text x="1027" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">寄存器 / mmac</text>
  <rect x="915" y="168" width="110" height="44" rx="6" fill="#2f6fdb"/>
  <text x="970" y="188" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">W</text>
  <text x="970" y="205" text-anchor="middle" fill="#dcebfc" font-size="10.5">buffer_load 直入</text>
  <rect x="1040" y="210" width="110" height="44" rx="6" fill="#2f9e5b"/>
  <text x="1095" y="230" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">A</text>
  <text x="1095" y="247" text-anchor="middle" fill="#eafaf0" font-size="10.5">ds_read 回读</text>
  <rect x="915" y="298" width="235" height="84" rx="8" fill="#4b5563"/>
  <text x="1032" y="336" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">mmac 计算</text>
  <text x="1032" y="360" text-anchor="middle" fill="#e5e7eb" font-size="13.5" font-weight="700">D = A × W</text>

  <!-- ===== Arrows ===== -->
  <!-- weight: HBM -> L2 -->
  <path d="M305,205 L325,205" fill="none" stroke="#2f6fdb" stroke-width="3.2" marker-end="url(#aw)"/>
  <!-- weight: L2 -> VGPR W-box (arc over LDS) -->
  <path d="M590,205 Q 742,105 966,166" fill="none" stroke="#2f6fdb" stroke-width="3.2" marker-end="url(#aw)"/>
  <text x="742" y="98" text-anchor="middle" font-size="12" fill="#2f6fdb" font-weight="700">权重绕过 LDS → 直入寄存器</text>
  <!-- weight: VGPR W-box -> mmac -->
  <path d="M970,212 L970,298" fill="none" stroke="#2f6fdb" stroke-width="3.2" marker-end="url(#aw)"/>

  <!-- activation: HBM -> L2 -->
  <path d="M305,385 L325,385" fill="none" stroke="#2f9e5b" stroke-width="3.2" marker-end="url(#aa)"/>
  <!-- activation: L2 -> LDS -->
  <path d="M590,385 L610,385" fill="none" stroke="#2f9e5b" stroke-width="3.2" marker-end="url(#aa)"/>
  <!-- activation: LDS -> VGPR A-box -->
  <path d="M875,385 Q 940,330 1038,236" fill="none" stroke="#2f9e5b" stroke-width="3.2" marker-end="url(#aa)"/>
  <!-- activation: VGPR A-box -> mmac -->
  <path d="M1095,254 L1095,298" fill="none" stroke="#2f9e5b" stroke-width="3.2" marker-end="url(#aa)"/>
  <text x="742" y="440" text-anchor="middle" font-size="12" fill="#2f9e5b" font-weight="700">激活经 LDS 中转</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="484" width="1120" height="100" rx="10" fill="#f6f7f9" stroke="#c7cdd6" stroke-width="1.4"/>
  <text x="60" y="512" font-size="13.5" font-weight="700" fill="#1f2937">读法</text>
  <rect x="60" y="526" width="16" height="16" fill="#2f6fdb"/>
  <text x="84" y="540" font-size="12.5" fill="#374151">权重 W：HBM → L2 → 寄存器（<tspan font-weight="700">不经 LDS</tspan>）；流式读 1 次 → 打 slc evict-first</text>
  <rect x="60" y="552" width="16" height="16" fill="#2f9e5b"/>
  <text x="84" y="566" font-size="12.5" fill="#374151">激活 A：HBM → L2 → LDS → 寄存器；复用 1600 次 → <tspan font-weight="700">留 L2 常驻</tspan></text>
  <rect x="720" y="526" width="26" height="16" fill="#eef4fd" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="756" y="540" font-size="12.5" fill="#b45309" font-weight="700">slc 作用点（bit17）</text>
  <text x="720" y="566" font-size="12" fill="#5b6472">slc ≠ bypass：加位的权重仍进 L2，只是最先被逐</text>
</svg>
